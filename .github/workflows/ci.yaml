name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VP_VERSION: "1.4.0"

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@v1.51.1

  tree_sitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install pnpm dependencies
        run: vp pm ci

      - name: Verify package lockfile is up to date
        run: |
          vp install --lockfile-only --ignore-scripts
          git diff --exit-code -- pnpm-lock.yaml

      - name: Regenerate parser
        run: vp run generate

      - name: Run corpus tests
        run: vp run test

      - name: Select matching Graphcal fixture branch
        id: graphcal_ref
        env:
          CANDIDATE_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] && \
            [[ -n "$CANDIDATE_REF" ]] && git ls-remote --exit-code --heads \
            https://github.com/graphcal-lang/graphcal.git \
            "refs/heads/$CANDIDATE_REF" > /dev/null
          then
            echo "ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout graphcal fixtures
        uses: actions/checkout@v7.0.1
        with:
          repository: graphcal-lang/graphcal
          ref: ${{ steps.graphcal_ref.outputs.ref }}
          path: graphcal
          persist-credentials: false

      # Guard against grammar gaps accumulating silently (issue #31):
      # every valid fixture in the matching companion branch, or main, must parse.
      - name: Parse all valid fixtures from graphcal
        run: vp run parse --quiet 'graphcal/tests/fixtures/valid/**/*.gcl'

      # - name: Validate highlight query
      #   working-directory: tree-sitter-graphcal
      #   run: tree-sitter query queries/highlights.scm ../tests/fixtures/invalid/functions.gcl > /dev/null

      - name: Verify no uncommitted changes
        run: git diff --exit-code

  prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: j178/prek-action@v3.1.0
        with:
          # Follow the prek version bundled with the action (updated by Renovate).
          prek-version: latest-known
          # no-commit-to-branch fails on pushes to main.
          extra-args: --all-files --skip=no-commit-to-branch

  actions-lock:
    name: Verify actions lockfile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify .github/workflows/actions.lock
        run: gh actions-lock --verify

  collect:
    needs: [typos, tree_sitter, prek, actions-lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.typos.result }}" "${{ needs.tree_sitter.result }}" "${{ needs.prek.result }}" "${{ needs.actions-lock.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All jobs passed"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VP_VERSION: "0.3.2"

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  tree_sitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@9fd26ff49f9b5e6276c2b493da4454ad4527f7f4 # v1.20.0
        with:
          version: ${{ env.VP_VERSION }}
          node-version-file: .node-version
          run-install: false
          cache: true

      - name: Install npm dependencies
        run: vp pm ci

      - name: Verify package lockfile is up to date
        run: |
          vp install --lockfile-only --ignore-scripts
          git diff --exit-code -- package-lock.json

      - name: Regenerate parser
        run: vp run generate

      - name: Run corpus tests
        run: vp run test

      - name: Select matching Graphcal fixture branch
        id: graphcal_ref
        env:
          CANDIDATE_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] && \
            [[ -n "$CANDIDATE_REF" ]] && git ls-remote --exit-code --heads \
            https://github.com/graphcal-lang/graphcal.git \
            "refs/heads/$CANDIDATE_REF" > /dev/null
          then
            echo "ref=$CANDIDATE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout graphcal fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: graphcal-lang/graphcal
          ref: ${{ steps.graphcal_ref.outputs.ref }}
          path: graphcal
          persist-credentials: false

      # Guard against grammar gaps accumulating silently (issue #31):
      # every valid fixture in the matching companion branch, or main, must parse.
      - name: Parse all valid fixtures from graphcal
        run: vp run parse --quiet 'graphcal/tests/fixtures/valid/**/*.gcl'

      # - name: Validate highlight query
      #   working-directory: tree-sitter-graphcal
      #   run: tree-sitter query queries/highlights.scm ../tests/fixtures/invalid/functions.gcl > /dev/null

      - name: Verify no uncommitted changes
        run: git diff --exit-code

  collect:
    needs: [typos, tree_sitter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.typos.result }}" "${{ needs.tree_sitter.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All jobs passed"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: crate-ci/typos@37bb98842b0d8c4ffebdb75301a13db0267cef89 # v1.47.2

  tree_sitter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install npm dependencies
        run: npm ci

      - name: Regenerate parser
        run: npm run generate

      - name: Run corpus tests
        run: npm test

      - name: Checkout graphcal fixtures
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          repository: graphcal-lang/graphcal
          path: graphcal
          persist-credentials: false

      # Guard against grammar gaps accumulating silently (issue #31):
      # every valid fixture in the main repo must parse without errors.
      - name: Parse all valid fixtures from graphcal
        run: npx tree-sitter parse --quiet 'graphcal/tests/fixtures/valid/**/*.gcl'

      # - name: Validate highlight query
      #   working-directory: tree-sitter-graphcal
      #   run: tree-sitter query queries/highlights.scm ../tests/fixtures/invalid/functions.gcl > /dev/null

      - name: Verify no uncommitted changes
        run: git diff --exit-code

  collect:
    needs: [typos, tree_sitter]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.typos.result }}" "${{ needs.tree_sitter.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more jobs failed"
              exit 1
            fi
          done
          echo "All jobs passed"
